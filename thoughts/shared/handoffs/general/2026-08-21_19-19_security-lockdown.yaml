blockers:
  - shred_pending stays 1 after a wipe, so every boot re-runs one and the watch sits permanently mid-wipe with a lock screen that ignores taps

questions:
  - Does prv_shred() reach shred.c:292, or block earlier in the db re-init at :270-276? Note the blocking work should only be ~2s, so a stall is a deadlock rather than slowness.
  - Should reconnecting the phone auto-unlock, or only cancel the countdown (currently only cancels)?
  - Export PEBBLE_SECURITY_SHRED_EVENT to third-party apps via the SDK (applib wrapper, syscall, exported_symbols.json, SDK bump)?

decisions:
  - shred_scope_is_restorable_only: Health/step data, app persist storage and BT pairing are never wiped. The phone cannot restore them, so wiping would make the feature too destructive to enable. Cost - a seized watch still yields step and sleep history.
  - reboot_while_armed_always_shreds: SELECT+BACK for 5s hard resets from the button ISR below anything software can intercept, so restarting must never be cheaper than waiting. User explicitly rejected a phone-connected exception.
  - no_pfs_format: Would take health data and pairing with it, so the shred zeroes files then sweeps sectors instead. Best-effort against chip-off; FTL may retain remapped pages.
  - sha256_vendored_not_mbedtls: third_party/wscript_build only recurses mbedtls under CONFIG_BT_FW_NIMBLE, so qemu_emery never builds it. A lock that only works on some boards is not a lock.
  - duress_does_not_notify_phone: SHRED_COMPLETE and the unfaithful flag are suppressed for duress, or the phone restores everything in seconds and the duress PIN achieves nothing.
  - pin_gate_is_the_current_pin: An earlier phone-connected requirement was removed; knowing the current PIN is the control, and the Settings flow already demands it.
  - feature_gated_on_SERVICE_TOUCH: Emery/gabbro only. Verified enabled on qemu_emery, disabled on asterix.
  - wipe_runs_after_boot_not_during: Nothing touches flash inside services_normal_early_init(). Deferring does not weaken the threat model - an attacker reading the flash directly never boots the watch - and the blocking work is only about 2s anyway (7 small file zeroes plus ~10 sector erases for the 640KB coredump and debug regions). The sweep, the only long part, is budgeted and runs in the background. Holding the UI for that is fine; blocking the boot was not.

findings:
  - shred_pending_stuck: prv_shred sets it at shred.c:201 and clears at :292, but starts the async sweep at :267 and re-inits four databases at :270-276 in between. Console (KernelBG) still answers while the launcher task is blocked, which matches the observed "lock screen visible, taps ignored".
  - pin_pad_input_is_fine: Instrumented probes showed touchdown and liftoff at identical coordinates resolving to keys 0,1,2,3 for "1234". Entry works; the watch never leaves the wipe.
  - db_deinit_is_launcher_task_only: pin_db_deinit/reminder_db_deinit/timeline_event_deinit deadlock if driven from KernelBG. factory_reset_fast runs them from the launcher task for this reason.
  - watchdog_masking_hid_a_deadlock: Masking only the current task turned a reset loop into a permanent hang. Long loops must call task_watchdog_bit_set_all(), not bit_set(current).
  - nothing_may_touch_flash_before_boot_completes: The wipe ran inside services_normal_early_init() and blocked boot for as long as it took, presenting as a watch stuck on the boot splash.
  - security_lock_logs_are_compiled_out: PBL_SHOULD_LOG gates on the compile-time module level and CONFIG_SERVICE_SECURITY_LOCK_LOG_LEVEL is 0, so PBL_LOG_DBG never emits. Cost several cycles chasing an endpoint that was never broken.
  - gadgetbridge_ignores_is_unfaithful: Upstream GB never parses it; the flag is at payload offset 150 of 155 and GB's parse stops at 47.
  - REASON_LOCKDOWN_is_a_real_signal: NotificationListenerService.REASON_LOCKDOWN (23) fires per notification on lockdown, but not at all if zero notifications are active - hence the mandatory manual panic action.

