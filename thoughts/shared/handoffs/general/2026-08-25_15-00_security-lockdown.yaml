the_headline: >
  The "boot hang" was never in security_lock. prv_flash_erase_start() returned
  expected_duration * 7 / 8, the QEMU flash HAL reports 1ms, and 1*7/8 == 0 --
  which is that function's "already finished, semaphore released" signal. The
  caller skipped polling, prv_flash_erase_poll() never ran, and the erase
  semaphore leaked, so the next erase blocked forever on portMAX_DELAY. Four
  earlier fixes had been aimed at security_lock, which was merely the first code
  to erase a region that was both non-blank and not sector-aligned. Only the
  QEMU HAL truncates; real backends return 150/50ms. UNTESTED ON HARDWARE.

