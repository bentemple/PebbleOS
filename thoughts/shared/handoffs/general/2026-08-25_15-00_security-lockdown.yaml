bugs_found_and_fixed:
  - "flash_api.c integer truncation leaking the erase semaphore -- the boot hang"
  - "engage() always shredded, so the disconnect path erased at the LOCK delay
    and the 30-minute erase delay was dead code"
  - "the clock-rollback trigger was dead at boot, killed by a refactor that
    discarded a return value"
  - "layout_get_context() dereferencing a NULL layout's vtable -- deterministic
    HardFault, 34/34 trials, because the firmware links at VMA 0 so the read
    lands in the interrupt vector table"
  - "mutex_lock(NULL) from timeline_event's async init paired with a sync
    deinit, wedging KernelMain permanently"
  - "a locked watch stored notifications via THREE ingresses; the one that
    mattered is blob_db, which is how Gadgetbridge delivers"
  - "six other shredded stores were still accepted while locked"
  - "SHRED_COMPLETE was never delivered on the disconnect trigger -- no session
    exists by definition, and the is_unfaithful fallback is one Gadgetbridge
    does not read"
  - "a phone LOCK with no PIN wiped the watch, left it unlocked, and acked
    success"
  - "Gadgetbridge's CONFIGURE was 5 bytes against a 6-byte struct, so every one
    was dropped on a length check and the phone's timeout setting never worked"
  - "clear_pin() reset dirty_since_shred to its unknown-record default, so
    switching the feature off fabricated a dirty state; it also zeroed
    shred_pending, which could abandon a half-finished wipe"
  - "exported_symbols.json silently drops a symbol if its own revision is not
    bumped -- sdk_export.md said the generator errors out; it warns"

decisions:
  - master_switch_ships_off: >
      SecurityLockStateDisabled is the one notion of enabled. Off means no
      trigger fires. Setting a PIN turns it on; turning it off requires the PIN
      and clears it, so "has a PIN" and "is on" are one fact. Enforced at the
      two funnels, engage() and shred(), not at each caller.
  - watch_owns_its_settings: >
      CONFIGURE removed from the endpoint entirely. The phone can LOCK and ask
      for STATUS, but cannot weaken the watch. A phone that can disarm the watch
      is a phone that can be compelled to.
  - reconnect_never_unlocks: >
      Android keeps Bluetooth up while locked and Gadgetbridge reconnects
      unattended, so a reconnect proves nothing an attacker cannot arrange with
      a shielded bag.
  - blackout_follows_the_wipe_not_the_lock: >
      Locking leaves the radio up; shredding while locked takes it down and
      restores the prior airplane setting on unlock. Duress does not black out,
      because it runs unlocked and must look normal.
  - duress_at_the_disable_prompt_wipes_then_disables: >
      Ordered explicitly in one callback on one task. It was a race whose losing
      interleaving disarmed the lock with nothing erased.
  - datalogging_not_shredded: >
      dls files are the outbound watch-to-phone queue, so wiping them destroys
      data the phone does not have. Also removed a reachable PBL_CROAK.
  - prf_recovery_is_deliberate: >
      SELECT+BACK+UP boots recovery, which does not build this feature, and a
      factory reset from there is the way back into a watch whose PIN is lost.
      Documented as intended so nobody closes it.
  - configurable_wipe_targets_declined: >
      A menu to choose what gets erased, including health data and apps, was
      requested and then explicitly dropped by the user on 2026-08-25 -- "I
      don't want to build this additional wipe feature, because I don't need
      it". Do not resurrect it from the proposal's "considered and not built"
      note. If it ever returns, it breaks the invariant that everything the
      shred destroys comes back from the phone, which is what justifies
      triggering it aggressively, and it needs a scare-screen on enable.

open_questions:
  - hardware: >
      Nothing has run on a real watch. This matters more than usual: the bug
      that started all of this existed ONLY because of an emulator constant, so
      the emulator both created it and was the only place it could be found.
      The reverse case -- a bug that only exists on hardware -- is exactly what
      this session could not catch.
  - pfs_remove_croak_race: >
      pfs_shred -> pfs_remove PBL_CROAKs if the fd is IN_USE.
      notification_storage_store() releases s_pfs_mutex between pfs_open and
      pfs_close, and the wipe runs on a different task, so the window is real.
      Not reproduced in ~70 valid trials. Unproven, not disproven.
  - security_deadlines_hook: >
      The test command writes deadline timestamps without starting the periodic
      check that reads them, so they expire unnoticed. Use `security session 0`
      for deadline paths. Fixing it means exposing a timer-start API purely for
      testing.
  - three_stale_commit_messages: >
      73c54b5d0, 7a9e76d9a and d93f9b63f describe the phantom -- watchdog
      resets, slow sector erases, a KernelBG deadlock -- none of which was the
      cause. Later commits revert most of what they did and explain why, so the
      history is honest, but a reviewer reading forward hits three confident
      wrong explanations first. Either reword them or say so in the PR
      description. Leaning toward the PR description: the wrong turns are
      informative.

