the_headline: >
  The "boot hang" was never in security_lock. prv_flash_erase_start() returned
  expected_duration * 7 / 8, the QEMU flash HAL reports 1ms, and 1*7/8 == 0 --
  which is that function's "already finished, semaphore released" signal. The
  caller skipped polling, prv_flash_erase_poll() never ran, and the erase
  semaphore was leaked, so the next erase blocked forever on portMAX_DELAY.
  Four fixes had been made to the wrong subsystem for it. Only the QEMU HAL
  truncates today; real backends return 150/50ms. UNTESTED ON HARDWARE.

