decisions:
  - reconnect_never_unlocks: >
      An earlier revision unlocked on reconnect, reasoning that Gadgetbridge
      could not reach the watch unless the phone was unlocked. False - Android
      keeps Bluetooth up while locked and GB reconnects unattended. A shielded
      bag defeats it. Only the PIN clears a lock now.
  - datalogging_not_shredded: >
      dls files are the outbound watch-to-phone queue, so wiping them destroys
      data the phone does not have. They also carry activity samples, making it
      a partial wipe of the one category the design promises never to touch.
      ~8-9KB per phone-absent night is what the phone would never receive.
  - shred_reason_not_exposed_to_apps: >
      The SDK handler takes no arguments. Collapsing duress into unknown is not
      enough: an app can correlate the remaining values against state it can
      already read and recover duress by elimination.
  - dirty_flag_fails_toward_shredding: >
      Unknown or unreadable state means dirty. A redundant wipe is wasteful; a
      skipped one is a security failure.

open_questions:
  - security_deadlines_hook_does_not_start_the_timer: >
      The `security deadlines` test command writes the deadline timestamps but
      does not start the periodic check in endpoint.c, so they expire unnoticed
      -- observed sitting at lock_in=-72 still Armed. Use `security session 0`
      to exercise the deadline paths; it goes through the real handler, which
      arms and starts the timer. Fixing the hook means exposing a timer-start
      API from endpoint.c purely for testing, which may not be worth it.
  - never_erase_leaves_the_radio_up: >
      Airplane mode engages at the tail of security_lock_shred(), gated on
      is_locked(). With Erase After set to Never the lock deadline calls
      engage_lock_only() and no shred ever runs, so a locked watch stays on the
      air and keeps accepting the six unguarded BlobDB stores. CONFIRMED BY
      EXPERIMENT: `security delays 5 0` then `security session 0` gives
      "Engaging lock: disconnect timeout", state=2, and no blackout line at all.
      Arguably correct rather than a bug -- the stated model tied the blackout
      to shredding, and with Never there is no shred -- so the mitigation is the
      blob_db_insert() guard, which refuses the writes whatever the radio is
      doing. Whether to ALSO black out on plain locking is a UX trade: the phone
      connection would drop the moment the watch locks, before anything is
      erased. User's call.
  - record_version_shared: >
      RECORD_VERSION covers both the config record (holds the PIN) and the
      runtime record, so a runtime-only change discards the PIN and silently
      disarms the lock. The airplane-mode work was asked to split the constants.
      If it did not, this needs doing before ship.
  - shred_complete_no_db_bits: >
      A clean (no-op) wipe reports SHRED_COMPLETE with 0x80000000 - the
      non-BlobDB bit only. Confirm Gadgetbridge tolerates that.
  - pfs_remove_croak_race: >
      pfs_shred -> pfs_remove PBL_CROAKs if the fd is IN_USE.
      notification_storage_store() releases s_pfs_mutex between pfs_open and
      pfs_close, and the wipe runs on a different task, so the window is real.
      Not reproduced in 45 valid trials. Unproven, still plausible.
  - lockdown_app_without_pin: >
      With no PIN set, engage() shreds without locking, so an app called
      "Lockdown" erases without locking. Fix belongs in lock.c or in the name,
      not in a second copy of the rule.

